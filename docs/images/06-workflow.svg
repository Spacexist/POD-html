<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">POD Image Workflow 四模块流程</title>
  <desc id="desc">印花重绘、元素提取、套图生成和商品导入四个模块依次传递结果。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f13"/>
      <stop offset="1" stop-color="#18120f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff713b"/>
      <stop offset="1" stop-color="#ffad45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff7a3d"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#ffffff" stroke-opacity=".035"/>
  <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#ffffff" stroke-opacity=".035"/>

  <text x="52" y="54" fill="#ff7a3d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL-FIRST POD PIPELINE</text>
  <text x="52" y="91" fill="#f7f7f5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">四模块 Workflow</text>
  <text x="1148" y="80" fill="#9c9c98" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">采集 → 重绘 → 提取 → 套图 → 商品包</text>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="238" height="202" rx="16" fill="#191919" stroke="#3a332f"/>
    <rect x="318" y="132" width="238" height="202" rx="16" fill="#191919" stroke="#3a332f"/>
    <rect x="584" y="132" width="238" height="202" rx="16" fill="#191919" stroke="#3a332f"/>
    <rect x="850" y="132" width="298" height="202" rx="16" fill="#191919" stroke="#ff713b" stroke-opacity=".75"/>
  </g>

  <rect x="70" y="151" width="42" height="28" rx="7" fill="url(#accent)"/>
  <rect x="336" y="151" width="42" height="28" rx="7" fill="url(#accent)"/>
  <rect x="602" y="151" width="42" height="28" rx="7" fill="url(#accent)"/>
  <rect x="868" y="151" width="42" height="28" rx="7" fill="url(#accent)"/>
  <text x="91" y="170" text-anchor="middle" fill="#111" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">01</text>
  <text x="357" y="170" text-anchor="middle" fill="#111" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">02</text>
  <text x="623" y="170" text-anchor="middle" fill="#111" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">03</text>
  <text x="889" y="170" text-anchor="middle" fill="#111" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800">04</text>

  <g fill="#f6f6f3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">
    <text x="70" y="213">印花重绘</text>
    <text x="336" y="213">元素提取</text>
    <text x="602" y="213">套图生成</text>
    <text x="868" y="213">商品导入</text>
  </g>
  <g fill="#a8a8a4" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">
    <text x="70" y="246">生成 · 重试 · 缓存</text>
    <text x="70" y="273">任务日志 · 可调并发</text>
    <text x="336" y="246">3×3 识别 · 命名组合</text>
    <text x="336" y="273">校对 · JSON / Excel</text>
    <text x="602" y="246">平面 / 曲面贴图</text>
    <text x="602" y="273">Homography 高清导出</text>
    <text x="868" y="246">Listing · SKU · 图片分配</text>
    <text x="868" y="273">Excel + 妙手素材 ZIP</text>
  </g>
  <g fill="#6fd3ff" font-family="Consolas, Microsoft YaHei, monospace" font-size="12">
    <text x="70" y="310">runtime/cache/output</text>
    <text x="336" y="310">renamed File[]</text>
    <text x="602" y="310">Listing folders</text>
    <text x="868" y="310">upload-ready package</text>
  </g>

  <path d="M291 232 H311" stroke="#ff7a3d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M557 232 H577" stroke="#ff7a3d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M823 232 H843" stroke="#ff7a3d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="52" y="365" width="1096" height="1" fill="#ffffff" fill-opacity=".09"/>
  <circle cx="66" cy="391" r="5" fill="#63d69b"/>
  <text x="80" y="396" fill="#b7b7b2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">模块间数据只在当前浏览器会话内传递；任务图片与日志由本地服务持久化。</text>
</svg>
