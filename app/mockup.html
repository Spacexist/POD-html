<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套图生成 · POD 图像工作台</title>
  <script src="/app/vendor/jszip.min.js"></script>
  <style>
    :root {
      --bg:#080b10; --panel:#151b26; --panel2:#101620; --border:#29364a;
      --accent:#55d69b; --accent2:#42c98f; --text:#f3fff9; --muted:#8fa0b9;
      --danger:#ff5568; --warning:#ffbd4a;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }
    header {
      height:58px; padding:0 28px; display:flex; align-items:center; justify-content:space-between;
      background:var(--panel); border-bottom:1px solid var(--border); position:relative; z-index:20;
    }
    header h1 { font-size:19px; display:flex; align-items:center; gap:9px; }
    header h1::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); }
    .back { color:var(--accent); text-decoration:none; font-size:14px; font-weight:700; }
    main { height:calc(100% - 58px); display:flex; }
    .sidebar {
      width:310px; flex:0 0 310px; padding:20px; background:var(--panel);
      border-right:1px solid var(--border); overflow:auto; position:relative; z-index:12;
    }
    .side-section { margin-bottom:20px; }
    .side-title { color:#96baf0; font-size:13px; margin-bottom:10px; }
    .card { padding:16px; border:1px solid var(--border); border-radius:9px; background:rgba(255,255,255,.018); }
    .card p { color:var(--muted); font-size:12px; line-height:1.65; }
    .factory-template {
      margin-bottom:12px; padding:13px; border:2px dashed #4b6881; border-radius:12px;
      background:#101722; cursor:grab; transition:.18s ease; user-select:none;
    }
    .factory-template:hover {
      border-color:var(--accent); background:rgba(54,221,168,.055);
      box-shadow:0 0 0 4px rgba(54,221,168,.08); transform:translateY(-2px);
    }
    .factory-template:active { cursor:grabbing; transform:scale(.985); }
    .template-title { display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:14px; }
    .template-title b { color:var(--accent); font-size:20px; }
    .template-layout { display:grid; grid-template-columns:34% 1fr; gap:7px; height:68px; margin:10px 0; }
    .template-layout i { display:block; border:1px solid #34445a; border-radius:6px; background:#090e16; }
    .template-layout i:last-child { border-style:dashed; }
    .template-tip { color:var(--muted); font-size:11px; text-align:center; }
    .btn {
      width:100%; min-height:43px; border:0; border-radius:7px; padding:10px 12px; cursor:pointer;
      background:var(--accent); color:#07110d; font-weight:800; transition:.16s ease;
    }
    .btn:hover { background:var(--accent2); transform:translateY(-1px); }
    .btn:active { transform:scale(.985); }
    .btn.secondary { color:var(--text); background:transparent; border:1px solid var(--border); }
    .btn.secondary:hover { background:rgba(255,255,255,.05); }
    .btn + .btn { margin-top:8px; }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .summary div { padding:10px; border-radius:7px; background:#0d121b; border:1px solid #222e40; }
    .summary b { display:block; color:var(--accent); font-size:18px; }
    .summary span { font-size:11px; color:var(--muted); }
    #viewport { flex:1; position:relative; overflow:hidden; background:#070a0f; user-select:none; }
    #viewport.factory-drag-over::after {
      content:"松开以创建工作区"; position:absolute; inset:24px; z-index:7; pointer-events:none;
      display:grid; place-items:center; border:2px dashed var(--accent); border-radius:18px;
      color:var(--accent); background:rgba(54,221,168,.045); font-size:18px; font-weight:800;
    }
    #dot-grid {
      position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
    }
    #world { position:absolute; left:0; top:0; width:1px; height:1px; transform-origin:0 0; }
    #empty-hint {
      position:absolute; left:100px; top:100px; width:720px; height:330px; display:grid; place-items:center;
      border:2px dashed #314058; border-radius:22px; color:#617189; background:rgba(16,22,32,.38);
      text-align:center; font-size:18px; line-height:1.8;
    }
    #empty-hint b { display:block; color:var(--accent); font-size:25px; }
    .factory {
      position:absolute; width:1510px; min-height:610px; padding:16px;
      border:2px dashed #4b6881; border-radius:18px; background:rgba(16,22,32,.96);
      box-shadow:0 18px 60px rgba(0,0,0,.32);
      transition:border-color .18s,box-shadow .18s,filter .18s;
    }
    .factory.entering { animation:factoryIn .2s cubic-bezier(.2,.8,.2,1); }
    @keyframes factoryIn { from{transform:scale(.96);opacity:.55;filter:brightness(1.35)} to{transform:scale(1);opacity:1;filter:none} }
    .factory.drop-ready {
      border-color:var(--accent); box-shadow:0 0 0 7px rgba(54,221,168,.09),0 18px 60px rgba(0,0,0,.34);
      filter:brightness(1.04);
    }
    .factory-head {
      height:48px; display:flex; align-items:center; justify-content:space-between; gap:14px;
      padding:0 2px 14px; border-bottom:1px solid rgba(64,82,108,.42); margin-bottom:16px;
    }
    .factory-title-wrap { display:flex; align-items:center; gap:10px; min-width:0; }
    .factory-handle {
      width:34px; height:32px; display:grid; place-items:center; border:1px solid var(--border);
      border-radius:7px; color:#8192aa; cursor:grab; background:#121a26; font-size:18px;
    }
    .factory-handle:active { cursor:grabbing; }
    .factory-title { min-width:0; }
    .factory-title h2 { font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .factory-title p { color:var(--muted); font-size:10px; margin-top:3px; }
    .factory-actions { display:flex; align-items:center; gap:8px; }
    .badge { color:var(--muted); border:1px solid var(--border); border-radius:99px; padding:5px 9px; font-size:10px; }
    .mini-btn {
      border:1px solid var(--border); border-radius:7px; background:#182130; padding:8px 11px; cursor:pointer;
      font-size:11px; font-weight:700; white-space:nowrap;
    }
    .mini-btn:hover { border-color:#526985; background:#202b3d; }
    .mini-btn.primary { background:var(--accent); color:#07110d; border-color:var(--accent); }
    .mini-btn.primary:hover { background:var(--accent2); }
    .mini-btn.danger:hover { color:#ffdce1; border-color:var(--danger); background:rgba(255,85,104,.1); }
    .mini-btn:disabled { opacity:.4; cursor:not-allowed; }
    .factory-body { display:grid; grid-template-columns:500px 1fr; gap:18px; align-items:start; }
    .preview-panel {
      width:500px; padding:11px; border:1px solid var(--border); border-radius:13px; background:#0d131d;
    }
    .preview-head { height:34px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .preview-head h3 { font-size:12px; }
    .preview-head span { max-width:260px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .factory-preview {
      display:block; width:476px; height:476px; border-radius:9px; background:#080c12;
      box-shadow:inset 0 0 0 1px #202b3c; cursor:default;
    }
    .factory-adjustments {
      width:min(620px,calc(100% - 222px)); margin:12px 0 0 222px; padding:10px;
      border:1px solid var(--border); border-radius:10px; background:#101720;
    }
    .factory-adjustments.no-template { opacity:.55; }
    .factory-adjustments.no-template .factory-curve { pointer-events:none; }
    .adjustment-heading,
    .adjustment-line {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .adjustment-heading { margin-bottom:9px; }
    .adjustment-heading strong { font-size:11px; }
    .adjustment-heading span,
    .adjustment-line span { color:var(--muted); font-size:9px; }
    .blend-segments { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:9px; }
    .blend-segment {
      height:30px; border:1px solid var(--border); border-radius:7px; background:#171f2b;
      color:var(--muted); cursor:pointer; font-size:10px; font-weight:700;
    }
    .blend-segment:hover { color:var(--text); border-color:#526985; }
    .blend-segment.active {
      color:#07110d; border-color:var(--accent); background:var(--accent);
    }
    .displacement-controls {
      display:grid; grid-template-columns:auto minmax(0,1fr) 36px; gap:7px 9px;
      align-items:center; padding:9px 0; border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
    }
    .displacement-controls label { color:#c9d0da; font-size:9px; }
    .displacement-controls input[type="range"] { width:100%; accent-color:var(--accent); }
    .displacement-controls output { color:var(--accent); font-size:9px; text-align:right; }
    .displacement-switch { display:flex; align-items:center; gap:6px; cursor:pointer; }
    .displacement-switch input { accent-color:var(--accent); }
    .factory-curve-wrap { margin-top:9px; }
    .factory-curve {
      display:block; width:100%; height:180px; margin-top:7px; border:1px solid var(--border);
      border-radius:8px; background:#0c121a; cursor:crosshair; touch-action:none;
    }
    .curve-caption {
      display:flex; justify-content:space-between; gap:8px; margin-top:5px;
      color:var(--muted); font-size:8px;
    }
    .scheme-panel {
      min-width:0; min-height:526px; padding:12px; border:1px solid #26374b; border-radius:13px; background:#0d141e;
    }
    .scheme-caption { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .scheme-caption h3 { font-size:13px; }
    .scheme-caption p { color:var(--muted); font-size:10px; }
    .scheme-flow { display:flex; align-items:flex-start; gap:13px; min-height:0; }
    .pattern-node {
      flex:0 0 176px; min-height:0; border:1px solid #3f526c; border-radius:11px; padding:10px;
      background:#121a26; cursor:pointer; transition:.16s;
    }
    .pattern-node:hover { border-color:var(--accent); }
    .node-label { display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:800; margin-bottom:8px; }
    .node-label span:last-child { color:var(--accent); font-size:10px; }
    .folder-empty {
      height:150px; display:grid; place-items:center; text-align:center; color:var(--muted);
      border:1px dashed #34445b; border-radius:9px; font-size:11px; line-height:1.6; padding:10px;
    }
    .folder-name { color:var(--text); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:7px; }
    .pattern-count { color:var(--muted); font-size:9px; margin-bottom:7px; }
    .pattern-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; max-height:260px; overflow:auto; padding:1px; }
    .pattern-thumb {
      aspect-ratio:1; border:1px solid #334157; border-radius:6px; overflow:hidden; background:#080c12; cursor:pointer;
    }
    .pattern-thumb.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(54,221,168,.24); }
    .pattern-thumb img,.slot img,.loose-item img { width:100%; height:100%; object-fit:contain; pointer-events:none; }
    .flow-arrow { align-self:center; color:#58718e; font-size:23px; }
    .pairs-wrap { flex:1; min-width:0; }
    .pairs-zone {
      display:flex; align-items:flex-start; flex-wrap:wrap; gap:10px; min-height:420px; padding:2px;
      border-radius:10px; transition:.16s;
    }
    .pairs-zone.drop-ready { background:rgba(54,221,168,.045); box-shadow:inset 0 0 0 1px rgba(54,221,168,.5); }
    .pair-card {
      width:145px; padding:8px; border:1px solid #35445b; border-radius:10px; background:#111925;
      transition:border-color .16s,transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
      animation:snapIn .18s cubic-bezier(.2,.8,.2,1); cursor:pointer;
    }
    @keyframes snapIn { from{transform:scale(.94);opacity:.7} to{transform:scale(1);opacity:1} }
    .pair-card:hover,.pair-card.active { border-color:var(--accent); }
    .pair-card.active { box-shadow:0 0 0 2px rgba(54,221,168,.15); }
    .pair-card.invalid { border-color:var(--danger); box-shadow:0 0 0 2px rgba(255,85,104,.1); }
    .pair-card.drop-target,.slot.drop-target { border-color:var(--accent); box-shadow:0 0 0 4px rgba(54,221,168,.15); }
    .pair-head { display:flex; align-items:center; justify-content:space-between; height:22px; margin-bottom:6px; }
    .pair-index { max-width:108px; color:var(--muted); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .delete-pair { border:0; background:transparent; color:#718199; cursor:pointer; padding:2px 4px; font-size:14px; }
    .delete-pair:hover { color:var(--danger); }
    .slot {
      height:150px; border:1px dashed #3a4a62; border-radius:7px; background:#090e16; overflow:hidden;
      position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.16s;
    }
    .slot + .slot { margin-top:7px; }
    .slot:hover { border-color:var(--accent); }
    .slot.has-file { border-style:solid; }
    .slot-label {
      position:absolute; left:4px; bottom:4px; padding:2px 5px; border-radius:4px;
      background:rgba(4,8,13,.82); color:#b9c8db; font-size:9px; pointer-events:none;
    }
    .slot-empty { color:#708099; text-align:center; font-size:10px; line-height:1.55; padding:7px; pointer-events:none; }
    .pair-error { min-height:27px; padding-top:5px; color:var(--danger); font-size:8px; line-height:1.35; }
    .pair-effect-summary {
      margin-top:5px; padding-top:5px; border-top:1px solid var(--border);
      color:var(--accent); font-size:8px; line-height:1.35;
    }
    .add-pair {
      width:76px; height:400px; border:1px dashed #40536d; border-radius:10px; background:rgba(255,255,255,.015);
      color:#66809f; cursor:pointer; font-size:32px; transition:.16s;
    }
    .add-pair:hover { color:var(--accent); border-color:var(--accent); background:rgba(54,221,168,.05); }
    .loose-item {
      position:absolute; width:180px; padding:9px; border:1px solid #4a5c75; border-radius:11px;
      background:#111925; box-shadow:0 14px 35px rgba(0,0,0,.36); cursor:grab;
    }
    .loose-item.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(54,221,168,.17),0 14px 35px rgba(0,0,0,.36); }
    .loose-item:active { cursor:grabbing; }
    .loose-head { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; margin-bottom:6px; }
    .loose-thumbs { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .loose-thumb {
      height:96px; border-radius:7px; background:#080d14; border:1px solid #2c394d; overflow:hidden;
      display:grid; place-items:center; color:#63748d; font-size:10px;
    }
    .loose-item.mask-only { width:126px; }
    .loose-item.mask-only .loose-thumbs { grid-template-columns:1fr; }
    .viewport-tips {
      position:absolute; left:24px; bottom:18px; z-index:8; display:flex; gap:17px; pointer-events:none;
      border:1px solid var(--border); border-radius:99px; padding:9px 15px; background:rgba(13,18,27,.9);
      color:var(--muted); font-size:11px;
    }
    .viewport-tips b { color:var(--accent); }
    .zoom-indicator {
      position:absolute; right:18px; bottom:18px; z-index:8; padding:8px 12px; border-radius:8px;
      background:rgba(13,18,27,.9); border:1px solid var(--border); color:var(--muted); font-size:11px;
    }
    input[type=file] { display:none; }
    .toast {
      position:fixed; left:50%; top:76px; z-index:2000; transform:translate(-50%,-12px); opacity:0;
      min-width:260px; max-width:600px; padding:11px 16px; border:1px solid var(--border); border-radius:9px;
      background:#17202e; color:var(--text); text-align:center; font-size:13px; pointer-events:none; transition:.2s;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.error { border-color:var(--danger); color:#ffdce1; }
    .progress { position:fixed; inset:0; z-index:1000; display:none; place-items:center; background:rgba(3,5,8,.84); }
    .progress.show { display:grid; }
    .progress-box { width:500px; padding:25px; border-radius:15px; background:var(--panel); border:1px solid var(--border); }
    .progress-box h3 { text-align:center; margin-bottom:18px; }
    .bar { height:11px; border-radius:99px; overflow:hidden; background:#273245; }
    .bar i { display:block; width:0; height:100%; background:var(--accent); transition:width .16s; }
    .progress-line { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:10px; }
    .log { height:110px; overflow:auto; margin-top:14px; padding:10px; border-radius:7px; background:#090e15; color:#9fd9c4; font:11px/1.55 monospace; }

    /* Codex-inspired neutral desktop theme */
    :root {
      --bg:#0d0d0d; --panel:#151515; --panel2:#1a1a1a; --border:#2d2d2d;
      --accent:#e8e8e8; --accent2:#ffffff; --text:#ececec; --muted:#929292;
      --danger:#ef6a74; --warning:#d7a94d; --success:#55c98c;
    }
    body {
      background:var(--bg); color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
      letter-spacing:.005em;
    }

    }

      padding-left:10px; border-left:1px solid #343434; color:#858585;
      font-size:12px; font-weight:500;
    }

      color:#b8b8b8; background:#191919; font-size:12px; font-weight:550;

    }
    .btn.secondary:hover { color:#fff; background:#232323; border-color:#454545; }

        spaceDown = true;
        event.preventDefault();
        viewport.style.cursor = "grab";
      }
      if ((event.key === "Delete" || event.key === "Backspace") && selectedLooseId && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        looseItems = looseItems.filter(/** Handle this UI callback. */function (item) {
          return item.id !== selectedLooseId;
        });
        selectedLooseId = null;
        renderLooseItems();
      }
    });
    window.addEventListener("keyup", /** Handle this UI callback. */function (event) {
      if (event.code === "Space") {
        spaceDown = false;
        if (!panning) viewport.style.cursor = "";
      }
    });
    window.addEventListener("blur", /** Handle this UI callback. */function () {
      spaceDown = false;
      panning = null;
      factoryMove = null;
      printDrag = null;
      viewport.style.cursor = "";
    });
    /** 在窗口尺寸变化后刷新视图并按实际尺寸重绘全部曲线。 */
    function handleWorkspaceResize() {
      let index = 0;
      updateView();
      for (index = 0; index < factories.length; index += 1) {
        if (factories[index].element) drawFactoryCurve(factories[index]);
      }
    }

    window.addEventListener("resize", handleWorkspaceResize);
    window.addEventListener("message", handleWorkflowPatternsMessage);
    window.addEventListener("beforeunload", releaseWorkspaceAssets);
    addFactoryAt(0, 0);
    updateView();
  </script>
</body>
</html>
